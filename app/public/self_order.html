<!DOCTYPE html>
<html lang="id" data-theme="emerald">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-Order E-Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
</head>
<body class="min-h-screen bg-base-200 text-base-content flex flex-col justify-between">

    <header class="navbar bg-base-100 shadow px-4 sticky top-0 z-40 flex justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-emerald-600 text-white rounded-lg flex items-center justify-center font-bold">🍽️</div>
            <div>
                <h1 class="text-xs font-black text-emerald-700" id="store-title">Self-Order E-Menu</h1>
                <p class="text-[10px] opacity-70" id="table-label">Meja -</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="openActiveOrderModal()" id="btn-active-cart" class="hidden btn btn-sm btn-outline btn-success font-bold text-xs">📋 Keranjang Meja</button>
            <button onclick="openCartModal()" class="btn btn-sm btn-success text-white font-bold text-xs">🛒 Keranjang (<span id="cart-count">0</span>)</button>
        </div>
    </header>

    <main class="max-w-md mx-auto w-full p-4 flex-1 space-y-4">
        <div class="form-control bg-base-100 p-3 rounded-2xl shadow-sm border space-y-2">
            <label class="text-xs font-bold">Nomor WhatsApp</label>
            <input type="tel" id="customer-whatsapp" onblur="checkWhatsappRegistered(this.value)" placeholder="Contoh: 081234567890" class="input input-bordered input-sm w-full text-xs font-bold">
            
            <div id="wa-notification" class="p-2 bg-warning/20 border border-warning rounded-xl hidden space-y-1">
                <p class="text-[11px] font-bold text-warning-content">⚠️ Nomor WA terdaftar atas nama: <span id="reg-name" class="underline"></span></p>
                <button onclick="verifyShooperData()" class="btn btn-xs btn-warning text-white font-bold w-full">Verify & Isi Otomatis</button>
            </div>

            <label class="text-xs font-bold pt-1">Nama Lengkap Pemesan</label>
            <input type="text" id="customer-name" oninput="this.value = this.value.toUpperCase()" placeholder="CONTOH: BUDI SANTOSO" class="input input-bordered input-sm w-full text-xs uppercase font-bold">
        </div>

        <div>
            <h3 class="font-black text-xs text-emerald-800 uppercase mb-2">Daftar Menu</h3>
            <div id="self-menu-grid" class="space-y-3"><p class="text-xs text-center py-10 opacity-60">Memuat menu...</p></div>
        </div>
    </main>

    <!-- MODAL KERANJANG -->
    <div id="cart-modal" class="modal">
        <div class="modal-box max-w-sm space-y-3 text-xs">
            <h3 class="font-bold text-sm text-emerald-700">🛒 Konfirmasi Pesanan Meja</h3>
            <div id="cart-items-summary" class="space-y-1 max-h-40 overflow-y-auto divide-y"></div>
            <div class="flex justify-between font-black text-sm border-t pt-2">
                <span>Total Tagihan:</span><span id="cart-grand-total" class="text-emerald-700">Rp 0</span>
            </div>
            <div class="modal-action flex gap-2">
                <button onclick="closeCartModal()" class="btn btn-sm btn-ghost flex-1">Batal</button>
                <button onclick="submitSelfOrder()" class="btn btn-sm btn-success text-white font-bold flex-1">Order</button>
            </div>
        </div>
    </div>

    <!-- MODAL STATUS / PESANAN AKTIF DENGAN FITUR UBAH QTY & HAPUS -->
    <div id="status-modal" class="modal">
        <div class="modal-box max-w-sm space-y-4 text-xs">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-base text-emerald-700">📋 Status Pesanan Meja</h3>
                <button onclick="closeStatusModal()" class="btn btn-xs btn-circle btn-ghost font-bold text-sm">✕</button>
            </div>
            <div class="py-3 bg-base-200 rounded-2xl space-y-2 border px-3 text-center">
                <p class="text-xs opacity-70">No. Order: <b id="st-order-id"># -</b></p>
                <div id="st-badge-container">
                    <span class="badge badge-warning text-white font-bold text-sm p-3">Billing Open</span>
                </div>
            </div>
            
            <div class="space-y-1">
                <p class="font-bold text-[11px] opacity-70">Daftar Menu Pesanan Anda (Dapat diubah Qty / Dihapus):</p>
                <div id="st-items-list" class="max-h-48 overflow-y-auto divide-y text-xs bg-base-100 p-2 rounded border space-y-2"></div>
            </div>

            <div class="flex justify-between font-black text-sm border-t pt-2">
                <span>Total Estimasi:</span><span id="st-grand-total" class="text-emerald-700">Rp 0</span>
            </div>

            <div class="modal-action flex gap-2">
                <button onclick="closeStatusModal()" class="btn btn-sm btn-ghost flex-1">Tutup</button>
                <button onclick="closeStatusModal()" class="btn btn-sm btn-success text-white font-bold flex-1">Pesan Lagi</button>
            </div>
        </div>
    </div>

    <script>
        let merchantId = 1, tableNumber = '1', globalMenus = [], cart = [], activeOrderId = localStorage.getItem('active_order_id') || null, verifiedName = '', activeOrderItems = [];

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            merchantId = urlParams.get('merchant') || 1;
            tableNumber = urlParams.get('table') || '1';
            document.getElementById('table-label').innerText = `Meja ${tableNumber}`;
            if (activeOrderId) { document.getElementById('btn-active-cart').classList.remove('hidden'); }
            loadSelfMenus();
        });

        async function checkWhatsappRegistered(phone) {
            if (!phone || phone.trim() === '') return;
            let formatted = phone.trim();
            if (formatted.startsWith('0')) formatted = '62' + formatted.substring(1);

            try {
                const res = await fetch('/api/verify-shooper', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ phone: formatted })
                });
                const data = await res.json();
                const notif = document.getElementById('wa-notification');
                if (data.success) {
                    verifiedName = data.name;
                    document.getElementById('reg-name').innerText = verifiedName;
                    notif.classList.remove('hidden');
                } else {
                    notif.classList.add('hidden');
                }
            } catch(e) {}
        }

        function verifyShooperData() {
            if (verifiedName) {
                document.getElementById('customer-name').value = verifiedName.toUpperCase();
                document.getElementById('wa-notification').classList.add('hidden');
            }
        }

        async function loadSelfMenus() {
            try {
                const res = await fetch('/api/merchants/active');
                const merchants = await res.json();
                const m = merchants.find(item => item.id == merchantId) || merchants[0];
                if (m) {
                    document.getElementById('store-title').innerText = m.name;
                    globalMenus = m.menus || [];
                    renderSelfMenus();
                }
            } catch(e) {
                document.getElementById('self-menu-grid').innerHTML = '<p class="text-xs text-error text-center">Gagal memuat menu.</p>';
            }
        }

        function renderSelfMenus() {
            const grid = document.getElementById('self-menu-grid');
            if (globalMenus.length === 0) { grid.innerHTML = '<p class="text-xs opacity-60 text-center py-6">Tidak ada menu tersedia.</p>'; return; }
            grid.innerHTML = '';
            globalMenus.forEach(m => {
                grid.innerHTML += `
                    <div class="card bg-base-100 border shadow-sm p-3 flex flex-row items-center justify-between">
                        <div class="flex items-center gap-3">
                            <img src="${m.image_url}" class="w-14 h-14 object-cover rounded-xl">
                            <div>
                                <h4 class="font-black text-xs">${m.name}</h4>
                                <p class="font-bold text-xs text-emerald-700">Rp ${m.price.toLocaleString('id-ID')}</p>
                            </div>
                        </div>
                        <button onclick="addToCart(${m.id}, '${m.name}', ${m.price})" class="btn btn-xs btn-success text-white font-bold">+ Tambah</button>
                    </div>
                `;
            });
        }

        function addToCart(id, name, price) {
            const ex = cart.find(i => i.menu_id === id);
            if (ex) ex.quantity += 1; else cart.push({ menu_id: id, name, price: parseFloat(price), quantity: 1 });
            updateCartCount();
        }

        function updateQtyCart(id, delta) {
            const item = cart.find(i => i.menu_id === id);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) cart = cart.filter(i => i.menu_id !== id);
            }
            updateCartCount();
            openCartModal();
        }

        function updateCartCount() {
            let count = 0; cart.forEach(i => count += i.quantity);
            document.getElementById('cart-count').innerText = count;
        }

        function openCartModal() {
            if (cart.length === 0) return alert('Keranjang masih kosong!');
            const container = document.getElementById('cart-items-summary');
            container.innerHTML = '';
            let gt = 0;
            cart.forEach(i => {
                let sub = i.price * i.quantity; gt += sub;
                container.innerHTML += `
                    <div class="py-2 flex justify-between items-center">
                        <div>
                            <p class="font-bold">${i.name}</p>
                            <p class="opacity-70">Rp ${i.price.toLocaleString('id-ID')} x ${i.quantity}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="font-black">Rp ${sub.toLocaleString('id-ID')}</span>
                            <div class="join border">
                                <button onclick="updateQtyCart(${i.menu_id}, -1)" class="btn btn-xs join-item">-</button>
                                <button class="btn btn-xs join-item btn-disabled">${i.quantity}</button>
                                <button onclick="updateQtyCart(${i.menu_id}, 1)" class="btn btn-xs join-item">+</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            document.getElementById('cart-grand-total').innerText = `Rp ${gt.toLocaleString('id-ID')}`;
            document.getElementById('cart-modal').classList.add('modal-open');
        }
        function closeCartModal() { document.getElementById('cart-modal').classList.remove('modal-open'); }

        async function openActiveOrderModal() {
            if (!activeOrderId) return alert('Belum ada pesanan aktif.');
            showStatusTracker(activeOrderId);
        }

        async function submitSelfOrder() {
            const name = document.getElementById('customer-name').value.trim();
            const whatsapp = document.getElementById('customer-whatsapp').value.trim();
            if (!name || !whatsapp) return alert('Mohon lengkapi Nama Lengkap dan Nomor WhatsApp!');

            const payload = { merchant_id: merchantId, table_number: tableNumber, customer_name: name, customer_whatsapp: whatsapp, items: cart };
            const res = await fetch('/api/self-order', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
            const data = await res.json();
            if (data.success) {
                activeOrderId = data.order_id;
                localStorage.setItem('active_order_id', activeOrderId);
                document.getElementById('btn-active-cart').classList.remove('hidden');
                cart = []; updateCartCount();
                closeCartModal();
                showStatusTracker(activeOrderId);
            } else {
                alert(data.error);
            }
        }

        async function showStatusTracker(orderId) {
            document.getElementById('st-order-id').innerText = `#${orderId}`;
            try {
                const res = await fetch(`/api/self-order/status/${orderId}`);
                const data = await res.json();
                activeOrderItems = data.items || [];
                renderActiveOrderItems();
                
                document.getElementById('st-grand-total').innerText = `Rp ${parseFloat(data.total_price).toLocaleString('id-ID')}`;
                const badgeContainer = document.getElementById('st-badge-container');
                if (data.status === 'completed' || data.status === 'paid') {
                    badgeContainer.innerHTML = `<span class="badge badge-success text-white font-bold text-base p-4">Lunas</span>`;
                    localStorage.removeItem('active_order_id');
                    activeOrderId = null;
                    document.getElementById('btn-active-cart').classList.add('hidden');
                } else {
                    badgeContainer.innerHTML = `<span class="badge badge-warning text-white font-bold text-base p-4">Billing Open</span>`;
                }
            } catch(e) {}

            document.getElementById('status-modal').classList.add('modal-open');
        }

        function renderActiveOrderItems() {
            const listEl = document.getElementById('st-items-list');
            listEl.innerHTML = '';
            if (activeOrderItems.length === 0) {
                listEl.innerHTML = '<p class="text-center py-2 opacity-60">Tidak ada item.</p>';
                return;
            }
            activeOrderItems.forEach(item => {
                let sub = item.price * item.quantity;
                listEl.innerHTML += `
                    <div class="py-1.5 flex justify-between items-center">
                        <div>
                            <p class="font-bold">${item.name}</p>
                            <p class="text-[10px] opacity-70">Rp ${item.price.toLocaleString('id-ID')} x ${item.quantity}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="font-black text-emerald-700">Rp ${sub.toLocaleString('id-ID')}</span>
                            <div class="join border">
                                <button onclick="updateActiveItemQty(${item.menu_id}, -1)" class="btn btn-xs join-item">-</button>
                                <button class="btn btn-xs join-item btn-disabled">${item.quantity}</button>
                                <button onclick="updateActiveItemQty(${item.menu_id}, 1)" class="btn btn-xs join-item">+</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        async function updateActiveItemQty(menuId, delta) {
            const item = activeOrderItems.find(i => i.menu_id === menuId);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    activeOrderItems = activeOrderItems.filter(i => i.menu_id !== menuId);
                }
            }
            // Kirim pembaruan ke server
            const payload = { order_id: activeOrderId, items: activeOrderItems };
            const res = await fetch('/api/self-order/update-items', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('st-grand-total').innerText = `Rp ${parseFloat(data.total_price).toLocaleString('id-ID')}`;
                renderActiveOrderItems();
            }
        }

        function closeStatusModal() {
            document.getElementById('status-modal').classList.remove('modal-open');
        }
    </script>
</body>
</html>
